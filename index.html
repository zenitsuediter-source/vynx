/* ================================ CHARTS =============================== */
function chartSVG(data, opts) {
  opts = opts || {};
  const W = 760, H = opts.height || 220, PL = 44, PR = 12, PT = 14, PB = 26;
  const max = Math.max(1, ...data.map(d => d.v));
  const nice = Math.pow(10, Math.floor(Math.log10(max))) * Math.ceil(max / Math.pow(10, Math.floor(Math.log10(max))));
  const iw = W - PL - PR, ih = H - PT - PB;
  const x = i => PL + (data.length <= 1 ? iw / 2 : (i / (data.length - 1)) * iw);
  const y = v => PT + ih - (v / nice) * ih;
  const pts = data.map((d, i) => [x(i), y(d.v)]);
  let line = '';
  pts.forEach((p, i) => {
    if (i === 0) { line += `M${p[0].toFixed(1)} ${p[1].toFixed(1)}`; return; }
    const prev = pts[i - 1], cx = (prev[0] + p[0]) / 2;
    line += ` C${cx.toFixed(1)} ${prev[1].toFixed(1)} ${cx.toFixed(1)} ${p[1].toFixed(1)} ${p[0].toFixed(1)} ${p[1].toFixed(1)}`;
  });
  const area = line + ` L${pts[pts.length - 1][0].toFixed(1)} ${PT + ih} L${pts[0][0].toFixed(1)} ${PT + ih} Z`;
  const gridN = 4;
  let grid = '';
  for (let i = 0; i <= gridN; i++) {
    const gy = PT + (ih / gridN) * i, val = nice * (1 - i / gridN);
    grid += `<line x1="${PL}" y1="${gy.toFixed(1)}" x2="${W - PR}" y2="${gy.toFixed(1)}" stroke="#22222e" stroke-width="1" stroke-dasharray="${i === gridN ? '0' : '3 5'}"/>
      <text x="${PL - 8}" y="${gy + 4}" text-anchor="end" font-size="10" fill="#6d6d80">${fmtNum(val)}</text>`;
  }
  const step = Math.max(1, Math.ceil(data.length / 8));
  let labels = '';
  data.forEach((d, i) => { if (i % step === 0 || i === data.length - 1) labels += `<text x="${x(i).toFixed(1)}" y="${H - 6}" text-anchor="middle" font-size="10" fill="#6d6d80">${esc(d.label)}</text>`; });
  const dot = opts.markLast !== false && pts.length ? `<circle cx="${pts[pts.length - 1][0].toFixed(1)}" cy="${pts[pts.length - 1][1].toFixed(1)}" r="3.5" fill="${opts.color || '#7c6cff'}"/>` : '';
  return `<svg class="chart-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:${H}px">
    <defs><linearGradient id="ar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${opts.color || '#7c6cff'}" stop-opacity=".34"/>
      <stop offset="1" stop-color="${opts.color || '#7c6cff'}" stop-opacity="0"/></linearGradient></defs>
    ${grid}<path d="${area}" fill="url(#ar)"/><path d="${line}" fill="none" stroke="${opts.color || '#7c6cff'}" stroke-width="2.1" stroke-linecap="round"/>${dot}${labels}</svg>`;
}
function barChartSVG(data, opts) {
  opts = opts || {};
  const W = 760, H = opts.height || 200, PL = 44, PR = 12, PT = 14, PB = 26;
  const max = Math.max(1, ...data.map(d => d.v));
  const iw = W - PL - PR, ih = H - PT - PB, bw = iw / data.length * .58;
  let bars = '', labs = '';
  data.forEach((d, i) => {
    const cx = PL + (i + .5) * (iw / data.length), h = (d.v / max) * ih;
    bars += `<rect x="${(cx - bw / 2).toFixed(1)}" y="${(PT + ih - h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="${opts.color || '#7c6cff'}" opacity="${.35 + .65 * (d.v / max)}"/>`;
    if (i % Math.max(1, Math.ceil(data.length / 9)) === 0) labs += `<text x="${cx.toFixed(1)}" y="${H - 6}" text-anchor="middle" font-size="10" fill="#6d6d80">${esc(d.label)}</text>`;
  });
  let grid = '';
  for (let i = 0; i <= 4; i++) { const gy = PT + (ih / 4) * i; grid += `<line x1="${PL}" y1="${gy.toFixed(1)}" x2="${W - PR}" y2="${gy.toFixed(1)}" stroke="#22222e" stroke-dasharray="3 5"/><text x="${PL - 8}" y="${gy + 4}" text-anchor="end" font-size="10" fill="#6d6d80">${fmtNum(max * (1 - i / 4))}</text>`; }
  return `<svg class="chart-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:${H}px">${grid}${bars}${labs}</svg>`;
}

/* =============================== ANALYTICS ============================= */
let anRange = '7D';
function analyticsSeries(pid, range) {
  const t = now();
  if (range === '24H') {
    const today = (DB.viewDaily[pid] || {})[dayKey(t)] || 0;
    const weights = [.02, .01, .01, .01, .02, .03, .05, .08, .1, .09, .07, .06, .05, .05, .05, .06, .07, .06, .05, .06, .06, .07, .06, .04];
    return weights.map((w, i) => ({ label: String(i).padStart(2, '0') + ':00', v: Math.round(today * w) }));
  }
  if (range === '7D' || range === '30D') {
    const n = range === '7D' ? 7 : 30;
    return dailySeries(pid, n).map(d => ({ label: d.k.slice(5), v: d.v }));
  }
  if (range === '3M') {
    const d = DB.viewDaily[pid] || {}, out = [];
    for (let w = 12; w >= 0; w--) {
      let sum = 0;
      for (let i = 0; i < 7; i++) sum += d[dayKey(t - (w * 7 + i) * DAY)] || 0;
      out.push({ label: 'W' + (13 - w), v: sum });
    }
    return out;
  }
  const d = DB.viewDaily[pid] || {}, out = [];
  for (let m = 0; m < 6; m++) {
    let sum = 0;
    for (let i = 0; i < 30; i++) sum += d[dayKey(t - (m * 30 + i) * DAY)] || 0;
    out.push({ label: new Date(t - m * 30 * DAY).toLocaleDateString(undefined, { month: 'short' }), v: sum });
  }
  return out.reverse();
}

function insights(scope, views, likes, saves, comments, avg) {
  const out = [];
  const best = scope.slice().sort((a, b) => viewsIn(b.id, 7) - viewsIn(a.id, 7))[0];
  if (best) out.push(`<b>${esc(best.title)}</b> brought in ${fmtNum(viewsIn(best.id, 7))} views this week — your strongest performer.`);
  if (views) out.push(`About ${((likes / views) * 100).toFixed(1)}% of viewers liked a project. Above 4% is healthy for a discovery platform.`);
  if (saves) out.push(`${fmtNum(saves)} saves means people are planning to come back. Saves are weighted heavily in trending.`);
  if (comments) out.push(`${fmtNum(comments)} comments — replies from you are shown as "creator" and generally double further replies.`);
  if (avg) out.push(avg >= 4.5 ? `Your average rating is ${avg.toFixed(2)} ★. Ratings feed directly into Top Rated and Hidden Gems.` : `Average rating ${avg.toFixed(2)} ★. Responding to critical reviews tends to help more than arguing with them.`);
  if (scope.length === 1) out.push('Publishing a second project cross-promotes: visitors to one page see your other work in "More like this".');
  return out.length ? out : ['Publish a project to start collecting analytics.'];
}

/* ---- economy migration: additive, never destroys existing data ---- */
function migrateEconomy() {
  DB.tips = DB.tips || [];
  DB.boosts = DB.boosts || [];
  DB.dms = DB.dms || [];
  DB.wallet = DB.wallet || {};
  DB.users.forEach(u => {
    u.money = u.money || { donations: true, note: '', methods: [], showTotal: false, clicks: 0 };
    u.money.methods = u.money.methods || [];
    u.msgPolicy = u.msgPolicy || 'everyone';
    u.blocked = u.blocked || [];
    u.theme = u.theme || { accent: '#7c6cff', cover: 'glow' };
    u.links = u.links || {};
    u.showMature = !!u.showMature;
    // accounts are active immediately — clean up any fields left by the old
    // verification build so nothing stale sits in the stored data
    delete u.emailVerified; delete u.verifyCode; delete u.verifyExpires; delete u.verifySends;
    if (u.pronouns === undefined) u.pronouns = '';
    if (u.banner === undefined) u.banner = '';
    if (u.music === undefined) u.music = null;
    if (!DB.wallet[u.id]) DB.wallet[u.id] = { credits: 0, ledger: [] };
    DB.wallet[u.id].ledger = DB.wallet[u.id].ledger || [];
  });
  DB.projects.forEach(p => {
    if (p.boost === undefined) p.boost = null;
    if (p.mature === undefined) p.mature = false;
    if (!p.links) p.links = [];
    if (p.music === undefined) p.music = null;
  });
}

function moneyOf(u) {
  if (!u) return { donations: false, note: '', methods: [], showTotal: false, clicks: 0 };
  u.money = u.money || { donations: true, note: '', methods: [], showTotal: false, clicks: 0 };
  u.money.methods = u.money.methods || [];
  return u.money;
}
function ensureWallet(id) {
  DB.wallet = DB.wallet || {};
  if (!DB.wallet[id]) DB.wallet[id] = { credits: 0, ledger: [] };

}

function ledgerAdd(id, entry) {
  const w = ensureWallet(id);
  w.ledger.unshift(Object.assign({ id: 'l' + uid(8), at: now() }, entry));

function creditsAdd(id, n, note, kind) {
  const w = ensureWallet(id);

}
function creditsSpend(id, n, note, kind) {
  const w = ensureWallet(id);
  if (w.credits < n) return false;
  w.credits -= n;
  ledgerAdd(id, { delta: -n, note, kind: kind || 'spend', balance: w.credits });

}

  renderSupportModal();
}
function renderSupportModal() {

function supReadAmount() {
  const i = $('#sup-custom');
  if (i) window._sup.amount = Math.max(1, Math.min(500, parseInt(i.value, 10) || 1));
  return window._sup.amount;
}
function supportOpen() {
  supReadAmount();
  const s = window._sup, u = userById(s.userId);
  const methods = moneyOf(u).methods.filter(m => m.enabled !== false);
  const chosen = methods.find(m => m.id === s.methodId) || methods[0];
  if (!chosen) return;
  const url = methodUrl(chosen, s.amount);
  u.money.clicks = (u.money.clicks || 0) + 1;
  saveDB();
  openExternal(url, tipType(chosen.type).name);
}
function supportLogged() {
  supReadAmount();
  const s = window._sup, u = userById(s.userId);
  const methods = (u.money.methods || []).filter(m => m.enabled !== false);
  const chosen = methods.find(m => m.id === s.methodId) || methods[0];
  const msg = ($('#sup-msg') || {}).value || '';
  addTip({ fromUserId: ME.id, toUserId: u.id, projectId: s.projectId, amount: 0, currencyAmount: s.amount, method: chosen ? chosen.type : 'external', message: msg.slice(0, 200), kind: 'external' });
  notify(u.id, 'tip', `<b>@${esc(ME.username)}</b> says they sent you ${econ().symbol}${s.amount}${s.projectId ? ' for <b>' + esc((projectById(s.projectId) || {}).title || '') + '</b>' : ''}`, '#/earnings');

  toast('Logged. ' + u.displayName + ' will see it in their earnings.');
}
function supportCredits() {
  supReadAmount();

  const amount = creditsFrom(s.amount);
  const msg = ($('#sup-msg') || {}).value || '';

  creditsSpend(ME.id, amount, 'Support — @' + u.username, 'tip');

function supportNudge() {

    $('#meth-preview').value = methodUrl(window._meth, 5) || '—';

  ['#meth-type', '#meth-handle'].forEach(sel => $(sel).addEventListener('input', upd));

function saveMethod(id) {
  const t = $('#meth-type').value, h = $('#meth-handle').value.trim();
  if (!h) { toast('Add your handle or link first.', 'err'); return; }
  if (t === 'custom' && !/^https?:\/\//i.test(h)) { toast('Custom links need to start with https://', 'err'); return; }
  if (t !== 'custom' && h.length < 2) { toast('That handle looks too short.', 'err'); return; }
  ME.money.methods = ME.money.methods || [];
  const i = ME.money.methods.findIndex(x => x.id === id);
  const entry = { id, type: t, handle: h, url: /^https?:\/\//i.test(h) ? h : '', enabled: true };
  if (i >= 0) ME.money.methods[i] = entry; else ME.money.methods.push(entry);
  saveDB(); closeModal();
  toast(i >= 0 ? 'Payment link updated.' : 'Payment link added.');
  if (/settings/.test(location.hash)) reload(); else renderNav();
}
function toggleMoney(k) {
  ME.money = ME.money || {};

}

function savePricing() {
  const e = econ();
  $$('[data-act="tierprice"]').forEach(i => { const t = e.tiers.find(x => x.id === i.dataset.id); if (t) t.credits = Math.max(0, parseInt(i.value, 10) || 0); });
  const r = $('[data-act="econrate"]'); if (r) e.rate = Math.max(1, parseInt(r.value, 10) || 100);
  saveDB(); toast('Pricing updated.'); reload();
}
function revokeBoost(id) {
  const b = DB.boosts.find(x => x.id === id); if (!b) return;
  b.until = now();
  const p = projectById(b.projectId);
  if (p && p.boost) p.boost = null;
  creditsAdd(b.userId, b.credits, 'Refund — promotion stopped by moderation', 'refund');
  notify(b.userId, 'tip', `Your promotion on <b>${esc(p ? p.title : 'a project')}</b> was stopped and refunded.`, '#/wallet');
  const u = userById(b.userId);
  if (u) u.money = u.money || {};
  saveDB(); toast('Promotion refunded and stopped.', 'info'); reload();
}

/* ==========================================================================
   VIDEO — one clip per promotion, hard limit 1 minute 30 seconds.
   Uploaded files live in IndexedDB (they are far too big for localStorage).
   Links to YouTube/Vimeo are embedded; direct .mp4/.webm links are probed for
   their real length before we accept them.
   ========================================================================== */
const MAX_VIDEO_SECONDS = 90;             // 1:30
const MAX_VIDEO_BYTES = 60 * 1024 * 1024; // 60MB

function fmtDur(sec) {
  if (sec == null || !isFinite(sec)) return '—';
  const s = Math.max(0, Math.round(sec)), m = Math.floor(s / 60);
  return m + ':' + String(s % 60).padStart(2, '0');
}
function durationVerdict(sec) {
  if (sec == null || !isFinite(sec)) return 'unknown';
  return sec > MAX_VIDEO_SECONDS + 0.75 ? 'long' : 'ok';
}

/* --------------------------- blob storage (IndexedDB) ------------------ */
const VideoStore = (function () {
  const DB_NAME = 'vynx-videos', STORE = 'files';
  const mem = {};
  let dbp = null;
  function open() {
    if (dbp) return dbp;
    dbp = new Promise((res, rej) => {
      let req;
      try { req = indexedDB.open(DB_NAME, 1); } catch (e) { return rej(e); }
      req.onupgradeneeded = () => { if (!req.result.objectStoreNames.contains(STORE)) req.result.createObjectStore(STORE); };
      req.onsuccess = () => res(req.result);
      req.onerror = () => rej(req.error);
      req.onblocked = () => rej(new Error('blocked'));
    }).catch(() => null);
    return dbp;
  }
  return {
    get available() { return open().then(db => !!db); },
    async put(id, blob) {
      const db = await open();
      if (!db) { mem[id] = blob; return; }
      await new Promise((res, rej) => {
        const t = db.transaction(STORE, 'readwrite');
        t.objectStore(STORE).put(blob, id);
        t.oncomplete = res; t.onerror = () => rej(t.error);
      }).catch(() => { mem[id] = blob; });
    },
    async get(id) {
      const db = await open();
      if (!db) return mem[id] || null;
      const blob = await new Promise(res => {
        const t = db.transaction(STORE, 'readonly');
        const r = t.objectStore(STORE).get(id);
        r.onsuccess = () => res(r.result || null);
        r.onerror = () => res(null);
      }).catch(() => null);
      return blob || mem[id] || null;
    },
    async del(id) {
      delete mem[id];
      const db = await open(); if (!db) return;
      await new Promise(res => {
        const t = db.transaction(STORE, 'readwrite');
        t.objectStore(STORE).delete(id);
        t.oncomplete = res; t.onerror = res;
      }).catch(() => {});
    }
  };
})();
const blobUrls = {};

/* ------------------------------ link parsing --------------------------- */
function parseVideoUrl(raw) {
  let u = String(raw || '').trim();
  if (!u) return null;
  if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
  let m;
  if ((m = u.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/)|youtu\.be\/)([A-Za-z0-9_-]{6,})/)))
    return { kind: 'embed', provider: 'youtube', id: m[1], embed: 'https://www.youtube.com/embed/' + m[1] };
  if ((m = u.match(/vimeo\.com\/(?:video\/)?(\d+)/)))
    return { kind: 'embed', provider: 'vimeo', id: m[1], embed: 'https://player.vimeo.com/video/' + m[1] };
  if (/\.(mp4|webm|ogv|ogg|mov)(\?.*)?$/i.test(u))
    return { kind: 'file', provider: 'file', url: u };
  return { kind: 'unknown', url: u };
}

/* read the real length off a media element */
function probeDuration(url) {
  return new Promise(resolve => {
    let v;
    try { v = document.createElement('video'); } catch (e) { return resolve(null); }
    let done = false;
    const finish = d => { if (done) return; done = true; clearTimeout(timer); v.removeAttribute('src'); resolve(d); };
    const timer = setTimeout(() => finish(null), 12000);
    v.preload = 'metadata'; v.muted = true;
    v.onloadedmetadata = () => {
      if (isFinite(v.duration) && v.duration > 0) return finish(v.duration);
      // some webm reports Infinity until it is forced to seek
      try { v.currentTime = 1e101; } catch (e) { return finish(null); }
      v.ontimeupdate = () => { v.ontimeupdate = null; finish(isFinite(v.duration) ? v.duration : null); };
    };
    v.onerror = () => finish(null);
    v.src = url;
  });
}

async function readVideoFile(file) {
  if (!file) throw 'nofile';
  if (!/^video\//i.test(file.type) && !/\.(mp4|webm|mov|ogv)$/i.test(file.name)) throw 'type';
  if (file.size > MAX_VIDEO_BYTES) throw 'size';
  const url = URL.createObjectURL(file);
  const d = await probeDuration(url);
  if (durationVerdict(d) === 'long') { try { URL.revokeObjectURL(url); } catch (e) {} throw 'long:' + Math.round(d); }
  return { url, duration: d, size: file.size, name: file.name };
}

/* ------------------------------ rendering ------------------------------ */
function videoInner(v) {
  if (!v) return '';
  if (v.kind === 'embed') return `<iframe src="${esc(v.embed)}" title="Project video" loading="lazy" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; picture-in-picture"></iframe>`;
  if (v.id) return `<video data-vid="${esc(v.id)}" controls preload="metadata" playsinline></video>`;
  return `<video src="${esc(v.url || '')}" controls preload="metadata" playsinline></video>`;
}
function videoPanel(p) {
  const v = p.video; if (!v) return '';
  const label = v.duration ? fmtDur(v.duration) : (v.kind === 'embed' ? 'embedded' : 'video');
  return `<div class="panel" id="video">
    <h2>${ic('play', 16)} Video <span class="pill" style="margin-left:6px;font-weight:400">${label}</span></h2>
    <div class="video-wrap">${videoInner(v)}</div>
    <p class="video-meta">${v.duration
      ? `${ic('check', 12)} ${fmtDur(v.duration)} · fits inside the 1:30 limit`
      : `${ic('external', 12)} ${v.provider === 'vimeo' ? 'Vimeo' : 'YouTube'} embed — Vynx cannot read the length of an embedded player.`}</p>
  </div>`;
}
function hydrateVideos() {
  $$('[data-vid]').forEach(async el => {
    if (el.dataset.hydrated) return;
    el.dataset.hydrated = '1';
    const id = el.dataset.vid;
    let url = blobUrls[id] || null;
    if (!url) {
      const blob = await VideoStore.get(id);
      if (blob) { url = URL.createObjectURL(blob); blobUrls[id] = url; }
    }
    if (url) el.src = url;
    else if (el.parentNode) el.outerHTML = '<div class="video-missing">This clip is not available in this browser session — uploaded videos are stored in this browser only.</div>';
  });
}

/* --------------------------- create-flow helpers ----------------------- */
function videoPreviewHTML(v) {
  const verdict = durationVerdict(v.duration);
  return `<div class="video-wrap">${videoInner(v)}</div>
    <p class="video-meta">${verdict === 'ok'
      ? `${ic('check', 12)} ${fmtDur(v.duration)} · inside the 1:30 limit`
      : `${ic('external', 12)} Length not readable for an embedded player — keep it under 1:30 yourself.`}
      ${v.name ? ' · ' + esc(String(v.name).slice(0, 60)) : ''}</p>
    <div style="display:flex;gap:9px;margin-top:12px;flex-wrap:wrap">
      <button class="btn sm" data-act="pickvideo">Replace</button>
      <button class="btn sm danger" data-act="removevideo">Remove video</button>
    </div>`;
}
function videoSectionHTML() {
  const v = cstate.video;
  return `<div class="panel"><h2>${ic('play', 16)} Video <span style="font-weight:400;font-size:12.5px;color:var(--text-4)">optional · one clip</span></h2>
    <p style="font-size:13.2px;color:var(--text-3);margin-bottom:14px">One video per promotion, and it has to be <b style="color:var(--text-2)">1 minute 30 seconds</b> or shorter. Uploads and direct file links are measured before we accept them.</p>
    ${v ? videoPreviewHTML(v) : `
      <div class="vid-drop">
        <div class="vid-drop-ic">${ic('play', 22)}</div>
        <button class="btn" data-act="pickvideo">${ic('plus', 14, 2)} Upload a video</button>
        <span>MP4, WEBM or MOV · max 90 seconds · up to 60MB</span>
      </div>
      <div class="row" style="margin-top:14px">
        <input class="input" id="c-videourl" placeholder="…or paste a YouTube, Vimeo or direct .mp4 link">
        <button class="btn" data-act="addvideolink" style="flex:none">Add link</button>
      </div>`}
  </div>`;
}
async function addUploadedVideo(file) {
  try {
    const r = await readVideoFile(file);
    const id = 'v' + uid(10);
    blobUrls[id] = r.url;
    await VideoStore.put(id, file);
    cstate.video = { kind: 'file', id, name: r.name, duration: r.duration, size: r.size };
    syncCreateForm(); reload();
    toast('Video added — ' + fmtDur(r.duration) + '.');
  } catch (e) {
    const msg = String(e);
    if (msg.startsWith('long:')) toast('That video is ' + fmtDur(parseInt(msg.slice(5), 10)) + ' long. The limit is 1:30.', 'err');
    else if (msg === 'size') toast('That file is over 60MB. Paste a link instead.', 'err');
    else if (msg === 'type') toast('Use an MP4, WEBM or MOV file.', 'err');
    else toast('That video could not be read.', 'err');
  }
}
async function addVideoLink(raw) {
  const v = parseVideoUrl(raw);
  if (!v) { toast('Paste a link first.', 'err'); return; }
  if (v.kind === 'unknown') { toast('That does not look like a video link. YouTube, Vimeo or a direct .mp4 works.', 'err'); return; }
  if (v.kind === 'embed') {
    cstate.video = { kind: 'embed', provider: v.provider, id: v.id, embed: v.embed, duration: null, name: v.provider === 'vimeo' ? 'Vimeo' : 'YouTube' };
    syncCreateForm(); reload();
    toast('Link added. We cannot measure an embedded player — keep it under 1:30.');
    return;
  }
  toast('Checking the length of that video…', 'info');
  const d = await probeDuration(v.url);
  if (durationVerdict(d) === 'long') { toast('That video is ' + fmtDur(d) + ' long. The limit is 1:30.', 'err'); return; }
  cstate.video = { kind: 'file', id: null, url: v.url, duration: d, name: decodeURIComponent((v.url.split('/').pop() || '').split('?')[0]).slice(0, 60) };
  syncCreateForm(); reload();
  toast(d ? 'Video added — ' + fmtDur(d) + '.' : 'Link added, but we could not read its length.');
}
function removeVideo() {
  const v = cstate.video;
  if (v && v.id) VideoStore.del(v.id);
  cstate.video = null;
  reload();
}

/* ------------------------------- discord ------------------------------- */
function discordButtonHTML(cls, label) {
  return `<a class="btn ${cls || ''}" href="${DISCORD_URL}" target="_blank" rel="noopener">${ic('discord', 16, 0, true)} ${label || 'Discord'}</a>`;

/* ==========================================================================
   MESSAGING, PROFILE THEMES & AVATARS
   Direct messages are local to this browser (there is no server), but the
   rules, policies, blocking and read-state all behave properly.
   ========================================================================== */
const MSG_MAX = 2000;
const MSG_SPAM_PER_MIN = 20;

/* ------------------------------- messages ------------------------------ */
function threadOf(a, b) {
  return DB.dms.filter(m => (m.from === a && m.to === b) || (m.from === b && m.to === a)).sort((x, y) => x.at - y.at);
}
function lastMsg(a, b) { const t = threadOf(a, b); return t.length ? t[t.length - 1] : null; }
function unreadFrom(otherId) { return DB.dms.filter(m => m.from === otherId && m.to === ME.id && !m.read && !m.removed).length; }
function unreadMessages() { return ME ? DB.dms.filter(m => m.to === ME.id && !m.read && !m.removed).length : 0; }
function conversations() {
  if (!ME) return [];
  const others = new Set();
  DB.dms.forEach(m => { if (m.from === ME.id) others.add(m.to); if (m.to === ME.id) others.add(m.from); });
  return Array.from(others).map(id => ({ id, user: userById(id), last: lastMsg(ME.id, id), unread: unreadFrom(id) }))
    .filter(c => c.user)
    .sort((a, b) => ((b.last ? b.last.at : 0) - (a.last ? a.last.at : 0)));
}
function canMessage(me, other) {
  if (!me || !other || me.id === other.id) return false;
  if ((other.blocked || []).includes(me.id)) return false;
  if ((me.blocked || []).includes(other.id)) return false;
  const pol = other.msgPolicy || 'everyone';
  if (pol === 'nobody') return false;
  if (pol === 'following') return (other.following || []).includes(me.id);
  return true;
}
function messageBlockReason(me, other) {
  if (!other) return 'That account is gone.';
  if ((other.blocked || []).includes(me.id)) return other.displayName + ' is not accepting your messages.';
  if ((me.blocked || []).includes(other.id)) return 'You blocked this person. Unblock them in Settings → Privacy.';
  const pol = other.msgPolicy || 'everyone';
  if (pol === 'nobody') return other.displayName + ' has messages turned off.';
  if (pol === 'following') return other.displayName + ' only takes messages from people they follow.';
  return '';
}
function sendMessage(toId, body) {
  if (!ME) return false;
  body = String(body || '').trim().slice(0, MSG_MAX);
  if (!body) return false;
  const other = userById(toId);
  if (!canMessage(ME, other)) { toast(messageBlockReason(ME, other) || 'You cannot message them.', 'err'); return false; }
  if (DB.dms.filter(m => m.from === ME.id && now() - m.at < 60000).length >= MSG_SPAM_PER_MIN) {
    toast('That is a lot of messages at once. Give it a minute.', 'err'); return false;
  }
  const msg = { id: 'd' + uid(9), from: ME.id, to: toId, body, at: now(), read: false, removed: false };
  DB.dms.push(msg);
  notify(toId, 'message', `<b>@${esc(ME.username)}</b> sent you a message`, '#/messages/' + ME.username);
  try { Sfx.send(); } catch (e) {}
  saveDB(); auditAchievements(ME);
  return msg;
}
function markThreadRead(otherId) {
  let changed = false;
  DB.dms.forEach(m => { if (m.from === otherId && m.to === ME.id && !m.read) { m.read = true; changed = true; } });
  if (changed) saveDB();
}
function blockUser(id2) {
  ME.blocked = ME.blocked || [];
  if (!ME.blocked.includes(id2)) ME.blocked.push(id2);
  saveDB(); toast('Blocked. They cannot message you now.', 'info');
  currentPath = ''; route(true); renderNav();
}
function unblockUser(id2) {
  ME.blocked = (ME.blocked || []).filter(x => x !== id2);
  saveDB(); toast('Unblocked.', 'info'); reload(); renderNav();
}

  return `<div class="wrap">
    <div class="page-head" style="display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap">
      <div><h1>Inbox</h1><p>${total ? total + ' unread message' + (total === 1 ? '' : 's') + '.' : 'Direct messages with other creators.'}</p></div>
      <a class="btn outline" href="#/settings?tab=privacy">${ic('lock', 14)} Who can message me</a>
    </div>
    ${cs.length ? cs.map(c => `
      <a class="convo" href="#/messages/${encodeURIComponent(c.user.username)}">
        <img class="avatar" width="42" height="42" src="${c.user.avatar}" alt="">
        <span style="flex:1;min-width:0">
          <span style="display:flex;align-items:center;gap:8px">
            <b style="font-size:14px">${esc(c.user.displayName)}</b>
            <span style="font-size:12px;color:var(--text-4)">@${esc(c.user.username)}</span>
            ${c.unread ? `<span class="pill acc" style="font-size:10px;padding:1px 8px">${c.unread} new</span>` : ''}
          </span>
          <span class="snip" style="display:block">${c.last ? (c.last.from === ME.id ? 'You: ' : '') + esc(c.last.body.replace(/\s+/g, ' ').slice(0, 90)) : 'No messages yet'}</span>
        </span>
        <span style="font-size:11.5px;color:var(--text-4);flex:none">${c.last ? timeAgo(c.last.at) : ''}</span>
      </a>`).join('') : emptyState('inbox', 'Your inbox is empty.',
        'Messages are only visible when you are signed in. Say something to a creator whose work you liked — their Message button is on their profile.',
        '/explore', 'Find someone to message')}
    ${cs.length ? `<p class="discord-inline">${ic('discord', 14, 0, true)} Most people just hang out in the <a href="${DISCORD_URL}" target="_blank" rel="noopener">Vynx Discord</a> instead.</p>` : ''}
  </div>`;
}

/* ----------------------------- conversation ---------------------------- */
function viewConversation(username) {
  const other = userByName(username);
  if (!other || other.role === 'admin') return viewNotFound();
  if (other.id === ME.id) { go('/messages'); return ''; }
  markThreadRead(other.id);
  const msgs = threadOf(ME.id, other.id).filter(m => !m.removed);
  const allowed = canMessage(ME, other);
  const reason = messageBlockReason(ME, other);
  const blocked = (ME.blocked || []).includes(other.id);

  return `<div class="wrap">
    <a class="btn ghost sm" href="#/messages" style="margin-bottom:14px;padding-left:0">${ic('chevron', 14)} Inbox</a>
    <div class="convo-head">
      <a href="#/profile/${encodeURIComponent(other.username)}"><img class="avatar" width="46" height="46" src="${other.avatar}" alt=""></a>
      <div style="flex:1;min-width:0">
        <a href="#/profile/${encodeURIComponent(other.username)}" style="font-weight:640;font-size:15px">${esc(other.displayName)}</a>
        <div style="font-size:12.5px;color:var(--text-3)">@${esc(other.username)}${(other.following || []).includes(ME.id) ? ' · follows you' : ''}</div>
      </div>
      <a class="btn sm" href="#/profile/${encodeURIComponent(other.username)}">Profile</a>
      ${blocked
        ? `<button class="btn sm" data-act="unblock" data-id="${other.id}">Unblock</button>`
        : `<button class="btn sm ghost icon" data-act="block" data-id="${other.id}" title="Block">${ic('ban', 15)}</button>`}
      <button class="btn sm ghost icon" data-act="report" data-type="profile" data-id="${other.id}" title="Report">${ic('flag', 15)}</button>
    </div>

    <div class="msg-wrap" id="msg-list">
      ${msgs.length ? msgs.map(m => {
        const mine = m.from === ME.id;
        return `<div class="msg ${mine ? 'mine' : ''}">
          ${mine ? '' : `<img class="avatar" width="28" height="28" src="${other.avatar}" alt="">`}
          <div class="bubble">${esc(m.body)}</div>
          <span class="when">${timeAgo(m.at)}${mine ? ' ·' : ''}</span>
          ${mine ? `<button class="msg-del" data-act="msgdel" data-id="${m.id}" title="Delete">${ic('x', 12)}</button>` : ''}
        </div>`;
      }).join('') : `<p style="text-align:center;color:var(--text-4);font-size:13.4px;padding:30px 10px">
        This is the start of your conversation with ${esc(other.displayName)}. Be a person about it.</p>`}
    </div>

    ${allowed ? `<div class="composer">
      <textarea class="textarea" id="msg-input" placeholder="Write a message…  (Enter to send, Shift+Enter for a new line)"></textarea>
      <button class="btn primary" data-act="msgsend" data-id="${other.id}">${ic('send', 15)} Send</button>
    </div>` : `<div class="mini-empty" style="margin-top:14px">${ic('lock', 16)}<span>${esc(reason)}</span></div>`}
  </div>`;
}
function afterMessagesRender() {
  const list = $('#msg-list');
  if (list) list.scrollTop = list.scrollHeight;
}

/* ----------------------------- profile themes -------------------------- */
const THEME_PRESETS = [
  { id: 'violet', name: 'Violet', accent: '#7c6cff' },
  { id: 'ice', name: 'Ice', accent: '#38bdf8' },
  { id: 'mint', name: 'Mint', accent: '#3ddc97' },
  { id: 'ember', name: 'Ember', accent: '#ff7a45' },
  { id: 'rose', name: 'Rose', accent: '#f472b6' },
  { id: 'gold', name: 'Gold', accent: '#e3b341' },
  { id: 'mono', name: 'Mono', accent: '#c9c9d6' }
];
const COVER_STYLES = [['glow', 'Glow'], ['grid', 'Grid'], ['rays', 'Rays'], ['plain', 'Plain']];
function themeOf(u) {
  u.theme = u.theme || { accent: '#7c6cff', cover: 'glow' };
  if (!u.theme.cover) u.theme.cover = 'glow';
  if (!u.theme.accent) u.theme.accent = '#7c6cff';
  return u.theme;
}
function hexRgb(h) {
  h = String(h || '').replace('#', '').trim();
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  const n = parseInt(h, 16);
  if (!isFinite(n)) return [124, 108, 255];
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
const lift = v => Math.min(255, v + 42);
function themeVars(u) {
  const t = themeOf(u), [r, g, b] = hexRgb(t.accent);
  return `--accent:${t.accent};--accent-2:rgb(${lift(r)},${lift(g)},${lift(b)});--accent-dim:rgba(${r},${g},${b},.15);--accent-line:rgba(${r},${g},${b},.4)`;
}
function coverStyleCSS(u) {
  const t = themeOf(u), [r, g, b] = hexRgb(t.accent), c = `${r},${g},${b}`;
  if (t.cover === 'grid') return `background-color:#12121a;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px),radial-gradient(620px 260px at 18% 0,rgba(${c},.34),transparent 72%);background-size:34px 34px,34px 34px,auto`;
  if (t.cover === 'rays') return `background-color:#101017;background-image:repeating-linear-gradient(114deg,rgba(${c},.17) 0 13px,transparent 13px 42px),radial-gradient(620px 280px at 82% 0,rgba(${c},.38),transparent 72%)`;
  if (t.cover === 'plain') return `background-color:#141420`;
  return `background-color:#121219;background-image:radial-gradient(540px 230px at 20% 0,rgba(${c},.36),transparent),radial-gradient(430px 210px at 88% 18%,rgba(${c},.17),transparent)`;
}
function avatarOptions(u) {
  const seedBase = (u.username || 'vynx').split('').reduce((a, ch) => a + ch.charCodeAt(0), 0);
  const name = u.displayName || u.username;
  return [0, 1, 2, 3, 4, 5, 6, 7].map(i => ({ seed: seedBase + i * 37 + 11, src: avatarArt(name, (seedBase + i * 37 + 11) % 360) }));
}
function setTheme(patchIn) {
  const t = themeOf(ME);
  Object.assign(t, patchIn);
  saveDB(); renderNav(); reload();
}

  return `<div class="panel"><h2>${ic('palette', 16)} Your page theme</h2>
    <p style="font-size:13.4px;color:var(--text-3);margin-bottom:16px">Pick a colour for your profile. It changes the buttons, links and cover on your page only &mdash; nobody else's.</p>

/* ==========================================================================

   --------------------------------------------------------------------------

   To share one database between everyone, paste an endpoint below. It must be

     1. console.firebase.google.com -> Add project
     2. Build -> Realtime Database -> Create database (test mode)
     3. Rules:  { "rules": { ".read": true, ".write": true } }   (see warning)

     5. Paste it below and add  /vynx.json  to the end

     2. That Location URL is your endpoint

function viewPeople(q) {

  if (term) {

    list = list.filter(u => u.username.toLowerCase().includes(t) || (u.displayName || '').toLowerCase().includes(t) || (u.bio || '').toLowerCase().includes(t));
  }
  const scored = list.map(u => ({ u, s: creatorStats(u.id) }));
  if (sort === 'new') scored.sort((a, b) => b.u.joined - a.u.joined);
  else if (sort === 'projects') scored.sort((a, b) => b.s.projectCount - a.s.projectCount);
  else if (sort === 'views') scored.sort((a, b) => b.s.views - a.s.views);
  else scored.sort((a, b) => b.s.followers - a.s.followers || b.s.views - a.s.views);

const SOCIAL_TYPES = [
  { id: 'discord', name: 'Discord', icon: 'discord', ph: 'username, or a https://discord.gg/… invite' },
  { id: 'x', name: 'X', icon: 'globe', ph: 'yourhandle' },
  { id: 'youtube', name: 'YouTube', icon: 'play', ph: '@yourchannel' },

const stripAt = s => String(s || '').trim().replace(/^@+/, '');
function linksOf(u) {

function socialHref(type, raw) {
  const h = stripAt(raw);
  if (!h) return '';
  const isUrl = /^https?:\/\//i.test(String(raw).trim());
  if (isUrl) return String(raw).trim();
  if (type === 'discord') return '';           // a bare username is not a link
  if (type === 'website') return '';
  if (type === 'x') return 'https://x.com/' + h;
  if (type === 'youtube') return 'https://youtube.com/' + (h.startsWith('@') ? h : '@' + h);
  if (type === 'twitch') return 'https://twitch.tv/' + h;
  return '';
}
function socialRowHTML(u) {
  const l = linksOf(u);
  const items = SOCIAL_TYPES.map(t => {
    const raw = (l[t.id] || '').trim();
    if (!raw) return '';
    const href = socialHref(t.id, raw);
    const body = `${ic(t.icon, 15, 0, t.id === 'discord')}<span>${esc(t.id === 'discord' && !href ? '@' + stripAt(raw) : t.name)}</span>`;
    return href
      ? `<a class="social-btn" href="${esc(href)}" target="_blank" rel="noopener" title="${esc(t.name)}">${body}</a>`
      : `<button class="social-btn" data-act="copysocial" data-v="${esc(stripAt(raw))}" title="Copy ${esc(t.name)} username">${body}</button>`;

  return items ? `<div class="social-row">${items}</div>` : '';
}

function hydrateAudio() {
  $$('[data-audio]').forEach(async box => {
    if (box.dataset.ready) return;
    box.dataset.ready = '1';
    const id = box.dataset.audio;
    let info = {};
    try { info = JSON.parse(box.dataset.info || '{}'); } catch (e) {}

async function addWizardMusic(file) {
  try {
    const info = await readAudioFile(file);
    const id = 'au' + uid(10);
    await VideoStore.put(id, file);
    if (!cstate) resetCreate();
    cstate.music = { id, name: info.name, size: info.size };
    syncCreateForm(); reload(); toast('Track added — ' + info.name + '.');
  } catch (e) {
    const m = String(e);
    if (m === 'size') toast('That track is over 15MB.', 'err');
    else if (m === 'type') toast('Use an MP3, M4A, WAV, OGG or FLAC file.', 'err');
    else toast('That file could not be read.', 'err');
  }
}

/* --------------------------- password reveal --------------------------- */
function enhancePasswordFields() {
  $$('input[type="password"]').forEach(inp => {
    if (inp.dataset.pw) return;
    inp.dataset.pw = '1';
    const wrap = document.createElement('div');
    wrap.className = 'pw-wrap';
    inp.parentNode.insertBefore(wrap, inp);
    wrap.appendChild(inp);
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'pw-eye';
    b.setAttribute('aria-label', 'Show password');
    b.innerHTML = ic('eye', 16);
    b.addEventListener('click', () => {
      const show = inp.type === 'password';
      inp.type = show ? 'text' : 'password';
      b.innerHTML = ic(show ? 'ban' : 'eye', 16);
      b.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
      b.classList.toggle('on', show);
    });
    wrap.appendChild(b);
  });
}

/* ==========================================================================
   SOUND — everything synthesised in the browser. No audio files, nothing to
   download, and it stays silent until the user actually interacts.
   ========================================================================== */
const Sfx = (function () {
  const KEY = 'vynx.sound.v1';
  let ctx = null, master = null, muted = false;
  try { muted = Store.get(KEY) === 'off'; } catch (e) {}

  function ensure() {
    if (ctx) { if (ctx.state === 'suspended') { try { ctx.resume(); } catch (e) {} } return ctx; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = 0.42;
      master.connect(ctx.destination);
    } catch (e) { ctx = null; }
    return ctx;
  }
  const live = () => !muted && !!ensure();
  function noiseBuf() {
    if (!ctx._nb) {
      const b = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.4), ctx.sampleRate);
      const d = b.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      ctx._nb = b;
    }
    return ctx._nb;
  }
  function tone(freq, dur, type, vol, slideTo) {
    const t = ctx.currentTime;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t + Math.min(0.014, dur * 0.35));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.03);
  }
  function noise(dur, vol, f0, f1, q) {
    const t = ctx.currentTime;
    const s = ctx.createBufferSource(); s.buffer = noiseBuf();
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = q || 1.5;
    bp.frequency.setValueAtTime(f0, t);
    bp.frequency.exponentialRampToValueAtTime(Math.max(40, f1), t + dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(bp); bp.connect(g); g.connect(master);
    s.start(t); s.stop(t + dur + 0.03);
  }
  return {
    get muted() { return muted; },
    setMuted(v) {
      muted = !!v;
      try { Store.set(KEY, muted ? 'off' : 'on'); } catch (e) {}
      if (!muted) { ensure(); this.tick(); }
    },
    toggle() { this.setMuted(!muted); return muted; },
    /* a light tap for buttons and links */
    click() { if (!live()) return; noise(0.035, 0.055, 2600, 1200, 2.2); tone(1900, 0.03, 'sine', 0.035); },
    tick() { if (!live()) return; tone(1250, 0.045, 'sine', 0.055, 1500); },
    pop() { if (!live()) return; tone(320, 0.11, 'sine', 0.075, 900); },
    /* something good happened */
    good() { if (!live()) return; tone(660, 0.1, 'sine', 0.06); setTimeout(() => { if (live()) tone(990, 0.13, 'sine', 0.055); }, 70); },
    /* something went wrong */
    bad() { if (!live()) return; tone(165, 0.2, 'square', 0.035, 110); noise(0.14, 0.03, 400, 200, 1); },
    /* movement between screens */
    nav() { if (!live()) return; noise(0.24, 0.028, 500, 2200, 1.1); },
    /* a message going out */
    send() { if (!live()) return; tone(780, 0.09, 'sine', 0.06, 1180); setTimeout(() => { if (live()) tone(1180, 0.1, 'sine', 0.045); }, 60); },
    /* a soft bell for notifications */
    bell() { if (!live()) return; tone(1046, 0.18, 'sine', 0.05); setTimeout(() => { if (live()) tone(1568, 0.22, 'sine', 0.04); }, 90); }
  };
})();

/* ------------------------------ top progress ---------------------------- */
function navProgress() {
  let bar = document.getElementById('navprog');
  if (!bar) { bar = document.createElement('div'); bar.id = 'navprog'; document.body.appendChild(bar); }
  bar.classList.remove('done');
  bar.style.transition = 'none';
  bar.style.width = '0%';
  bar.style.opacity = '1';
  requestAnimationFrame(() => {
    bar.style.transition = 'width .35s ease, opacity .3s ease';
    bar.style.width = '72%';
  });
  setTimeout(() => {
    bar.style.width = '100%';
    setTimeout(() => { bar.style.opacity = '0'; setTimeout(() => { bar.style.width = '0%'; }, 320); }, 220);
  }, 140);
}

function pulse(el) {
  if (!el) return;
  el.classList.remove('pulsing');
  void el.offsetWidth;
  el.classList.add('pulsing');
  setTimeout(() => el.classList.remove('pulsing'), 620);
}

function readImageFile(file, maxDim) {
  maxDim = maxDim || 1400;
  return new Promise((res, rej) => {
    if (!file) return rej('nofile');
    if (!/^image\/(png|jpe?g|webp|gif)$/i.test(file.type)) return rej('type');
    if (file.size > 8 * 1024 * 1024) return rej('size');
    const r = new FileReader();
    r.onload = () => {
      if (file.type === 'image/gif') return res(r.result);
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        const scale = Math.min(1, maxDim / Math.max(w, h));
        w = Math.round(w * scale); h = Math.round(h * scale);
        const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(img, 0, 0, w, h);
        res(cv.toDataURL('image/jpeg', .82));
      };
      img.onerror = () => rej('decode');
      img.src = r.result;
    };
    r.onerror = () => rej('read');
    r.readAsDataURL(file);
  });
}
function pickFiles(accept, multiple, cb) {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = accept; inp.multiple = !!multiple;
  inp.onchange = () => cb(Array.from(inp.files || []));
  inp.click();
}

function publishProject() {
  const firstEver = DB.projects.filter(x => !x.removed).length === 0;

  if (title.length < 2) { toast('Give your project a name.', 'err'); return; }
  if (title.length > 60) { toast('Project names are limited to 60 characters.', 'err'); return; }
  if (tagline.length < 8) { toast('Write a short description of at least 8 characters.', 'err'); return; }
  if (desc.length < 40) { toast('The full description needs at least 40 characters.', 'err'); return; }
  if (/[<>]/.test(title + tagline)) { toast('Remove HTML characters from your title.', 'err'); return; }

  const prev = projectsByCreator(ME.id);
  if (prev.length >= 30) { toast('You have reached the project limit on this account.', 'err'); return; }
  const recent = prev.filter(p => now() - p.createdAt < 60000);
  if (recent.length >= 3) { toast('You are publishing too quickly. Wait a moment.', 'err'); return; }

  const features = (($('#c-features') || {}).value || '').split('\n').map(s => s.trim()).filter(Boolean).slice(0, 12);
  const story = (($('#c-story') || {}).value || '').trim();
  const upv = (($('#c-upv') || {}).value || '').trim(), upb = (($('#c-upb') || {}).value || '').trim();

  let slug = slugify(title), n = 2;
  while (projectBySlug(slug)) slug = slugify(title) + '-' + n++;
  const id = 'p' + uid(8);
  const t = now();
  const p = {
    id, slug, title, tagline, description: desc, category: cstate.category, tags: cstate.tags.slice(),
    cover: cstate.cover || coverArt(title, Math.floor(Math.random() * 40), cstate.category.toUpperCase()),
    screenshots: cstate.screenshots.slice(), video: cstate.video || null, music: cstate.music || null, features, story,
    mature: !!cstate.mature, links: cleanLinks(cstate.links),
    creatorId: ME.id, createdAt: t, updatedAt: t, views: 0, likes: [], saves: [], hidden: false, removed: false, featured: false,
    updates: upb ? [{ version: upv || '1.0', body: upb, at: t }] : [],
    followers: []
  };
  DB.projects.unshift(p);
  DB.viewDaily[id] = { [dayKey(t)]: 0 };
  // notify followers
  (ME.followers || []).forEach(f => notify(f, 'update', `<b>@${esc(ME.username)}</b> published a new project: <b>${esc(title)}</b>`, '#/project/' + slug));
  notify(ME.id, 'milestone', `Your project <b>${esc(title)}</b> is live. Let's see where it goes.`, '#/project/' + slug);
  saveDB(); auditAchievements(ME); renderNav();
  toast('Published. Your project is live.');

  publishSuccess(saved, firstEver);
  currentPath = '';
  route(true);
}

/* ---------------------- internal navigation safety ---------------------
   Some preview frames intercept clicks on links, or refuse them outright and
   report "access denied". Handling in-app links ourselves means navigation is
   plain JavaScript and works anywhere the page itself runs.  */
document.addEventListener('click', e => {
  const a = e.target.closest && e.target.closest('a[href^="#"]');
  if (!a) return;
  const href = a.getAttribute('href') || '';
  if (href.length < 2) return;
  e.preventDefault();
  go(href.slice(1));
}, true);

    case 'admrestorep': { const p = projectById(id); if (p) { p.removed = false; p.hidden = false; } saveDB(); toast('Project restored.'); reload(); break; }
    case 'admremovec': { const c = DB.comments.find(x => x.id === id); if (c) { c.removed = true; c.reported = false; } const r = DB.reports.find(x => x.id === el.dataset.rep); if (r) r.status = 'resolved'; saveDB(); toast('Comment removed.', 'info'); reload(); break; }
    case 'admrestorec': { const c = DB.comments.find(x => x.id === id); if (c) c.removed = false; saveDB(); toast('Comment restored.'); reload(); break; }
    case 'admremover': { const r2 = DB.reviews.find(x => x.id === id); if (r2) { r2.reported = true; } const r = DB.reports.find(x => x.id === el.dataset.rep); if (r) r.status = 'resolved'; saveDB(); toast('Review removed.', 'info'); reload(); break; }
    case 'admclearreport': {
      if (el.dataset.kind === 'comment') { const c = DB.comments.find(x => x.id === id); if (c) c.reported = false; }
      else { const r = DB.reviews.find(x => x.id === id); if (r) r.reported = false; }
      saveDB(); toast('Flag cleared.', 'info'); reload(); break;
    }
    case 'admsuspend': {
      const u = userById(id); if (!u) break;
      u.status = u.status === 'suspended' ? 'active' : 'suspended';
      const r = DB.reports.find(x => x.id === el.dataset.rep); if (r) r.status = 'resolved';
      saveDB(); toast(u.status === 'suspended' ? '@' + u.username + ' suspended.' : '@' + u.username + ' restored.', 'info'); reload(); break;
    }
    case 'admban': { const u = userById(id); if (u) { u.banned = true; u.status = 'banned'; } saveDB(); toast('User banned.', 'info'); reload(); break; }
    case 'admunban': { const u = userById(id); if (u) { u.banned = false; u.status = 'active'; } saveDB(); toast('User unbanned.'); reload(); break; }
    case 'admmakemod': { const u = userById(id); if (u) { u.role = u.role === 'moderator' ? 'user' : 'moderator'; } saveDB(); toast('Role updated.'); reload(); break; }
    /* ---- money ---- */
    case 'topup': openTopupModal(); break;
    case 'buypack':
    case 'grantpack': {
      const n = parseInt(el.dataset.credits, 10) || 0;
      if (el.dataset.act === 'buypack') {
        openModal(`<div class="mb" style="text-align:center;padding:34px 24px">
          <div class="pop-mark" style="background:var(--accent-dim);border-color:var(--accent-line);color:var(--accent-2)">${ic('spark', 28)}</div>
          <h2 style="font-size:21px">${fmtNum(n)} demo credits</h2>
          <p style="color:var(--text-3);font-size:13.5px;margin:10px auto 0;max-width:360px">This is the part a real app would hand to a payment provider. Here it just appears, because nothing is being charged and we would rather say that than show you a fake card form.</p>
          <div style="display:flex;gap:10px;justify-content:center;margin-top:22px;flex-wrap:wrap">
            <button class="btn primary lg" data-act="grantpack" data-credits="${n}">Add them</button>
            <button class="btn outline lg" data-act="closemodal">Cancel</button>
          </div></div>`, { size: 'sm' });
      } else grantPack(n);
      break;
    }
    case 'boostpage': { const sl = el.dataset.slug; if (sl) go('/boost/' + sl); else toast('That project is gone.', 'err'); break; }
    case 'boostbuy': buyBoost(el.dataset.slug, el.dataset.tier); break;
    case 'admrevokeboost': revokeBoost(el.dataset.id); break;
    case 'savepricing': savePricing(); break;
    case 'addmethod': methodModal(null); break;
    case 'editmethod': methodModal((ME.money.methods || []).find(x => x.id === el.dataset.id)); break;
    case 'delmethod': {
      const m = (ME.money.methods || []).find(x => x.id === el.dataset.id);
      if (!m) break;
      if (!confirm('Remove this payment link?')) break;
      ME.money.methods = ME.money.methods.filter(x => x.id !== el.dataset.id);
      saveDB(); toast('Payment link removed.', 'info'); reload(); break;
    }
    case 'savemethod': saveMethod(el.dataset.id); break;
    case 'savenote': {
      ME.money = ME.money || {};
      ME.money.note = (($('#money-note') || {}).value || '').trim().slice(0, 120);
      saveDB(); toast('Support message saved.'); break;
    }
    case 'togglemoney': toggleMoney(el.dataset.k); break;
    case 'support': openSupportModal(el.dataset.id, el.dataset.p || null); break;
    case 'supamount': window._sup.amount = parseInt(el.dataset.v, 10); renderSupportModal(); break;
    case 'supmethod': window._sup.methodId = el.dataset.id; renderSupportModal(); break;
    case 'supopen': supportOpen(); break;
    case 'suplogged': supportLogged(); break;
    case 'supcredits': supportCredits(); break;
    case 'supnudge': supportNudge(); break;
    case 'copyval': {
      const inp = el.parentNode.querySelector('input');
      try { await navigator.clipboard.writeText(inp ? inp.value : ''); } catch (err) {}
      toast('Copied to your clipboard.'); break;
    }
    case 'togglesound': { const m = Sfx.toggle(); toast(m ? 'Sounds off.' : 'Sounds on.', 'info'); reload(); break; }
    /* ---- shared database ---- */
    case 'synctest': syncTestRun(); break;
    case 'syncup': {
      toast('Uploading your copy…', 'info');
      const ok = await Sync.forcePush();
      toast(ok ? 'Uploaded to the shared copy.' : 'Could not upload — check the connection test.', ok ? '' : 'err');
      renderNav(); reload(); break;
    }
    case 'syncdown': {
      toast('Downloading the shared copy…', 'info');
      await Sync.forcePull();
      toast('Downloaded. Anything new has been merged in.');
      renderNav(); reload(); break;
    }
    /* ---- music, banners, pronouns, drawing ---- */
    case 'pickwizardmusic': syncCreateForm(); pickFiles('audio/*', false, files => addWizardMusic(files[0])); break;
    case 'removewizardmusic': { if (cstate.music) VideoStore.del(cstate.music.id); cstate.music = null; reload(); break; }
    case 'pickmusic': {
      const kind = el.dataset.kind, pid = el.dataset.id;
      pickFiles('audio/*', false, files => attachMusic(kind === 'profile' ? { kind: 'profile', id: ME.id } : { kind: 'project', id: pid }, files[0]));
      break;
    }
    case 'removemusic': removeMusic({ kind: el.dataset.kind, id: el.dataset.id }); break;
    case 'setpronouns': { ME.pronouns = el.dataset.p; saveDB(); reload(); break; }
    case 'savepronouns': {
      const i = $('#pronouns-custom');
      ME.pronouns = ((i ? i.value : '') || '').trim().slice(0, 24);
      saveDB(); toast(ME.pronouns ? 'Pronouns saved.' : 'Pronouns cleared.'); reload(); break;
    }
    case 'pickbanner': pickBanner(); break;
    case 'clearbanner': ME.banner = ''; saveDB(); toast('Banner removed.', 'info'); reload(); break;
    case 'drawwide': openDraw({ w: 1200, h: 400, target: 'banner', title: 'Draw your banner' }); break;
    case 'drawcover': openDraw({ w: 1024, h: 640, target: 'cover', title: 'Draw a cover' }); break;
    case 'drawshot': openDraw({ w: 1024, h: 640, target: 'shot', title: 'Draw a screenshot' }); break;
    case 'drawsave': drawSave(el.dataset.target); break;
    case 'drawcolour': { const D = window._draw; if (!D) break; D.colour = el.dataset.c; D.erase = false; $$('.dsw').forEach(x => x.classList.toggle('on', x === el)); break; }
    case 'drawsize': { const D = window._draw; if (!D) break; D.size = parseInt(el.dataset.s, 10); $$('.dsz').forEach(x => x.classList.toggle('on', x === el)); break; }
    case 'drawerase': { const D = window._draw; if (!D) break; D.erase = !D.erase; toast(D.erase ? 'Eraser on.' : 'Eraser off.', 'info'); break; }
    case 'drawclear': { const D = window._draw; if (!D) break; D.undo.push(D.cv.toDataURL()); D.ctx.fillStyle = '#101017'; D.ctx.fillRect(0, 0, D.W, D.H); break; }
    case 'drawundo': {
      const D = window._draw; if (!D || !D.undo.length) break;
      const img = new Image();
      img.onload = () => { D.ctx.clearRect(0, 0, D.W, D.H); D.ctx.drawImage(img, 0, 0); };
      img.src = D.undo.pop();
      break;
    }
    /* ---- flow + arcade ---- */
    case 'scrollmode': go('/scroll'); break;
    case 'flowdown': flowStep(1); break;
    case 'flowup': flowStep(-1); break;
    case 'flowrestart': { currentPath = ''; route(true); setTimeout(() => { const f = $('#flow'); if (f) f.scrollTop = 0; }, 60); break; }
    case 'arcstart': arcStart(el.dataset.game); break;
    case 'arcmenu': arcMenu(); break;
    case 'archl': arcHL(el.dataset.v); break;
    case 'archlnext': arcHLNext(); break;
    case 'arctt': arcTT(el.dataset.id); break;
    case 'arccat': arcChoice(el.dataset.c, null, v => ARC.round.target.category === v, 'it is ' + ARC.round.target.category); break;
    case 'arccreator': arcChoice(el.dataset.u, null, v => ARC.round.correct.username === v, 'made by @' + ARC.round.correct.username); break;
    case 'arctag': arcChoice(el.dataset.t, null, v => ARC.round.correct === v, 'the tag is ' + ARC.round.correct); break;
    case 'arcblur': arcChoice(el.dataset.c, null, v => ARC.round.target.category === v, 'it is ' + ARC.round.target.category); break;
    case 'arcblurmore': ARC.round.stage = Math.min(3, ARC.round.stage + 1); reload(); break;
    case 'arcscramble': arcScramble(); break;
    case 'arcmem': arcMem(parseInt(el.dataset.i, 10)); break;
    case 'arcfake': arcFake(el.dataset.t); break;
    case 'arcsnipe': arcSnipe(); break;
    case 'arcttt': arcTTTMove(parseInt(el.dataset.i, 10)); break;
    case 'arc2048': arc2048(el.dataset.d); break;
    case 'arcsnake': arcSnakeDir(el.dataset.d); break;
    case 'arcmine': arcMine(parseInt(el.dataset.i, 10)); break;
    case 'arcflag': { ARC.round.flagMode = !ARC.round.flagMode; reload(); break; }
    case 'arcfrenzy': arcFrenzy(parseInt(el.dataset.i, 10)); break;
    case 'arcnext': arcNext(); break;
    /* ---- mature content, project links, site theme ---- */
    case 'reveal': revealMature(el.dataset.id); reload(); break;
    case 'setmaturepref': {
      if (!ME) { go('/login'); break; }
      ME.showMature = el.dataset.v === '1';
      saveDB(); toast(ME.showMature ? 'Mature content will be shown.' : 'Mature content will be blurred again.', 'info');
      renderNav(); reload(); break;
    }
    case 'addlink': {
      syncCreateForm();
      cstate.links = cstate.links || [];
      if (cstate.links.length >= 6) { toast('Six links is the limit.', 'err'); break; }
      cstate.links.push({ label: '', url: '' });
      reload(); break;
    }
    case 'removelink': {
      syncCreateForm();
      cstate.links.splice(parseInt(el.dataset.i, 10), 1);
      reload(); break;
    }
    case 'setmode': {
      const b = e.target.closest('button'); if (!b) break;
      setSiteTheme({ mode: b.dataset.m }); break;
    }
    case 'setaccent': setSiteTheme({ accent: el.dataset.accent }); break;
    /* ---- people, links, shuffle, sync ---- */
    case 'shuffle': shuffleProject(); break;
    case 'peoplesort': { const b = e.target.closest('button'); if (!b) break; go('/people?sort=' + b.dataset.s + (parseHash().q.q ? '&q=' + encodeURIComponent(parseHash().q.q) : '')); break; }
    case 'copysocial': { try { await navigator.clipboard.writeText(el.dataset.v || ''); } catch (err) {} toast('Copied ' + (el.dataset.v || '')); break; }
    case 'savelinks': {
      const l = linksOf(ME);
      $$('[data-link]').forEach(i => { l[i.dataset.link] = i.value.trim().slice(0, 200); });
      saveDB(); toast('Links saved — they are on your profile now.');
      break;
    }
    case 'syncnow': {
      if (!Sync.enabled()) { toast('Sharing is off — see Settings → Account.', 'info'); break; }
      toast('Syncing…', 'info');
      await Sync.pull(); await Sync.push();
      toast(Sync.status === 'live' ? 'Synced with the shared database.' : 'Could not reach the shared database.', Sync.status === 'live' ? '' : 'err');
      renderNav(); reload(); break;
    }
    /* ---- messaging + profile customisation ---- */
    case 'msgsend': {
      const ta = $('#msg-input');
      const body = ta ? ta.value : '';
      if (sendMessage(el.dataset.id, body)) { if (ta) ta.value = ''; reload(); }
      break;
    }
    case 'msgdel': {
      const m = DB.dms.find(x => x.id === el.dataset.id);
      if (m && m.from === ME.id) { m.removed = true; saveDB(); reload(); }
      break;
    }
    case 'msgblocked': { const u = userById(el.dataset.id); toast(messageBlockReason(ME, u) || 'You cannot message them.', 'info'); break; }
    case 'block': {
      const u = userById(el.dataset.id);
      if (!u) break;
      if (!confirm('Block @' + u.username + '? They will not be able to message you and their messages will be hidden from your inbox.')) break;
      ME.blocked = ME.blocked || [];
      ME.blocked.push(u.id);
      saveDB(); toast('Blocked @' + u.username + '.', 'info');
      currentPath = ''; route(true); renderNav();
      break;
    }
    case 'unblock': unblockUser(el.dataset.id); break;
    case 'setmsgpolicy': { ME.msgPolicy = el.dataset.pol; saveDB(); toast('Message settings updated.'); reload(); break; }
    case 'settheme': setTheme({ accent: el.dataset.accent }); break;
    case 'setcover': {
      const b = e.target.closest('button'); if (!b) break;
      setTheme({ cover: b.dataset.cover }); break;
    }
    case 'setavatar': {
      ME.avatar = el.dataset.src; saveDB(); renderNav();
      const pv = $('#avatar-preview'); if (pv) pv.src = ME.avatar;
      $$('.ava-opt').forEach(o => o.classList.toggle('on', o.dataset.src === ME.avatar));
      toast('Profile picture updated.'); break;
    }
    case 'omniopen': closeModal(); go('/project/' + el.dataset.slug); break;
    case 'omniprofile': closeModal(); go('/profile/' + el.dataset.u); break;
    case 'omniquick': { const i = $('#omni'); if (i) { i.value = el.dataset.q; omniResults(el.dataset.q); } break; }
    case 'lightbox': openLightbox(el.dataset.src); break;
    case 'dismissnotice': { const n = $('.notice'); if (n) n.style.display = 'none'; break; }
  }
});
function openLightbox(src) {
  const l = document.createElement('div');
  l.className = 'lightbox';
  l.innerHTML = `<img src="${src}" alt="">`;
  l.addEventListener('click', () => l.remove());
  $('#overlays').appendChild(l);
}
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('pcard')) {
    go('/project/' + e.target.dataset.slug);
  }
  if (e.key === 'Enter' && e.target.id === 'c-taginput') { e.preventDefault(); addTag(e.target.value); }
  if (e.key === 'Enter' && e.target.id === 'msg-input' && !e.shiftKey) {
    e.preventDefault(); const b = $('[data-act="msgsend"]'); if (b) b.click();
  }
  if (e.key === 'Enter' && (e.target.id === 'c-input') && !e.shiftKey) {
    e.preventDefault(); const b = $('[data-act="comment"]'); if (b) b.click();
  }
});

/* --------------------------- form submissions -------------------------- */
document.addEventListener('submit', e => {
  const f = e.target;
  e.preventDefault();
  if (f.id === 'form-login') submitLogin(f);
  else if (f.id === 'form-signup') submitSignup(f);
  else if (f.id === 'form-forgot') submitForgot(f);
  else if (f.id === 'set-account') saveAccount(f);
  else if (f.id === 'set-profile') { ME.bio = f.elements.bio.value.trim().slice(0, 160); ME.longBio = f.elements.longBio.value.trim().slice(0, 2000); saveDB(); toast('Profile saved.'); renderNav(); }
  else if (f.id === 'set-password') savePassword(f);
}, true);
document.addEventListener('change', e => {
  if (e.target.dataset.act === 'searchsort') {
    const { q, cat, tag } = parseHash().q;
    go('/search?q=' + encodeURIComponent(q || '') + '&cat=' + encodeURIComponent(cat || 'All') + '&sort=' + e.target.value + (tag ? '&tag=' + encodeURIComponent(tag) : ''));
  }
  if (e.target.dataset.act === 'anscope') { setAnProject(e.target.value); }
  if (e.target.dataset.act === 'setaccentpick') { setTheme({ accent: e.target.value }); }
  if (e.target.dataset.act === 'setsiteaccent') { setSiteTheme({ accent: e.target.value }); }
});
document.addEventListener('submit', e => {
  if (e.target.dataset.act === 'peoplesearch') {
    e.preventDefault();
    go('/people?q=' + encodeURIComponent(e.target.elements.q.value.trim()));
  }
  if (e.target.dataset.act === 'searchsubmit') {
    e.preventDefault();
    const v = e.target.elements.q.value.trim();
    go('/search?q=' + encodeURIComponent(v));
  }
});

/* ------------------------------ popovers ------------------------------- */
function toggleNotifDropdown() {
  if ($('.dropdown')) { closePopovers(); return; }
  closePopovers();
  const ns = myNotifs().slice(0, 8);
  const dd = document.createElement('div');
  dd.className = 'dropdown'; dd.dataset.pop = '1';
  dd.innerHTML = `<div class="dh"><span>Notifications</span>
      ${unreadCount() ? `<button class="btn ghost sm" data-act="readall">Mark all read</button>` : ''}</div>
    <div class="dlist">${ns.length ? ns.map(n => `<a class="ntf ${n.read ? '' : 'unread'}" href="#${(n.link || '/explore').replace(/^#/, '')}" data-act="readnotif" data-id="${n.id}">
        <span style="width:30px;height:30px;border-radius:9px;background:var(--card-2);border:1px solid var(--border);display:grid;place-items:center;flex:none;color:var(--accent-2)">${ic(notifIcon(n.kind), 14)}</span>
        <span class="nt">${n.text}<span class="when">${timeAgo(n.createdAt)}</span></span></a>`).join('')
      : `<div style="padding:34px 20px;text-align:center;color:var(--text-3);font-size:13.4px">You're all caught up.<br><span style="color:var(--text-4);font-size:12.5px">New activity will show up here.</span></div>`}</div>
    <div class="df"><a href="#/notifications" data-act="closemodal">View all notifications</a></div>`;
  dd.addEventListener('click', ev => { if (ev.target.closest('a')) closePopovers(); if (ev.target.closest('[data-act]')) setTimeout(closePopovers, 30); });
  document.body.appendChild(dd);
}
function toggleAvatarMenu() {
  if ($('.avatar-menu')) { closePopovers(); return; }
  closePopovers();
  const am = document.createElement('div');
  am.className = 'avatar-menu';
  am.innerHTML = `<div class="who"><img class="avatar" width="36" height="36" src="${ME.avatar}" alt="">
      <div><b>${esc(ME.displayName)}</b><small>@${esc(ME.username)}</small></div></div>
    <div class="sep"></div>
    <a class="mi" href="#/profile/${ME.username}" data-act="closemodal">${ic('user', 15)} Your profile</a>
    <a class="mi" href="#/analytics" data-act="closemodal">${ic('chart', 15)} Creator analytics</a>
    <a class="mi" href="#/saved" data-act="closemodal">${ic('bookmark', 15)} Saved &amp; liked</a>
    <button class="mi" data-act="togglesound">${ic('music', 15)} Sound ${Sfx.muted ? 'off' : 'on'}</button>
    <a class="mi" href="#/scroll" data-act="closemodal">${ic('play', 15)} Scroll mode</a>
    <a class="mi" href="#/arcade" data-act="closemodal">${ic('spark', 15)} Arcade</a>
    <a class="mi" href="#/messages" data-act="closemodal">${ic('inbox', 15)} Inbox${unreadMessages() ? `<span class="pill acc" style="margin-left:auto;font-size:10.5px;padding:1px 8px">${unreadMessages()}</span>` : ''}</a>
    <a class="mi" href="#/wallet" data-act="closemodal">${ic('grid', 15)} Wallet <span style="margin-left:auto;font-size:11.5px;color:var(--text-4)">${fmtNum(myCredits())} cr</span></a>
    <a class="mi" href="#/earnings" data-act="closemodal">${ic('heart', 15)} Earnings &amp; support</a>
    <a class="mi" href="${DISCORD_URL}" target="_blank" rel="noopener">${ic('discord', 15, 0, true)} Community Discord</a>
    <a class="mi" href="#/achievements" data-act="closemodal">${ic('spark', 15)} Achievements</a>
    ${isAdmin() ? `<a class="mi" href="#/admin" data-act="closemodal">${ic('shield', 15)} Admin dashboard</a>` : ''}
    <div class="sep"></div>
    <a class="mi" href="#/settings" data-act="closemodal">${ic('settings', 15)} Settings</a>
    <button class="mi" data-act="logout">${ic('logout', 15)} Log out</button>`;
  am.addEventListener('click', ev => { if (ev.target.closest('a')) closePopovers(); if (ev.target.closest('[data-act="logout"]')) setTimeout(closePopovers, 20); });
  document.body.appendChild(am);
}
document.addEventListener('click', e => {
  if (!e.target.closest('.dropdown,.avatar-menu,[data-act="bell"],[data-act="avmenu"]')) closePopovers();
});

/* ================================ BOOT ================================= */
window.addEventListener('hashchange', () => route(false));

function storageNotice() {
  if (Store.persistent) return;
  const bar = document.createElement('div');
  bar.className = 'notice';
  bar.innerHTML = `${ic('lock', 14)}<span><b>Preview mode.</b> This frame is not allowed to save to your browser, so an account made here lasts only until you close the tab. Open Vynx in its own tab to keep everything.</span>
    <button class="xbtn" data-act="dismissnotice" aria-label="Dismiss">${ic('x', 14)}</button>`;
  $('#shell').insertBefore(bar, $('#shell').children[1] || null);
}
(async function boot() {
  try { applySiteTheme(); } catch (e) {}
  $('#page').innerHTML = `<div class="wrap-wide" style="padding-top:40px">${skeletonGrid(8)}</div>`;
  try {
    await initDB();
  } catch (e) {
    console.error('Vynx failed to start:', e);
    DB = { users: [], projects: [], comments: [], reviews: [], notifications: [], reports: [], viewDaily: {}, meta: { version: 4 } };
  }
  try {
    renderNav();
    route(true);
    storageNotice();
    try { Sync.start(); } catch (e) {}
  } catch (e) {
    console.error(e);
    $('#page').innerHTML = `<div class="wrap-wide" style="padding:70px 0">
      <div class="empty"><div class="ic">${ic('compass', 24)}</div>
      <h3>Vynx could not start in this frame.</h3>
      <p>Something in this preview blocked a browser feature Vynx needs. Opening the file in its own tab normally fixes it.</p></div></div>`;
  }
  console.log('%cVYNX','background:#7c6cff;color:#0a0a0e;padding:3px 8px;border-radius:5px;font-weight:700','ready — you made it, vynx it.');
})();
          
</script>
</body>
